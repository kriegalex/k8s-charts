# Production deployment example with ingress and SSL
# Install with: helm install deltabadger ./deltabadger-helm -f examples/production-values.yaml

controllers:
  deltabadger:
    replicas: 1
    containers:
      app:
        image:
          tag: "latest"
          pullPolicy: Always
        env:
          APP_ROOT_URL: "https://deltabadger.example.com"
          HOME_PAGE_URL: "https://deltabadger.example.com"
          FORCE_SSL: "true"
        resources:
          limits:
            cpu: 2000m
            memory: 2Gi
          requests:
            cpu: 500m
            memory: 1Gi

service:
  app:
    type: ClusterIP

ingress:
  app:
    enabled: true
    className: nginx
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      # Backend protocol - Tell NGINX to use HTTP (not HTTPS) for backend
      nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
    hosts:
      - host: deltabadger.example.com
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: app
              port: http
    tls:
      - secretName: deltabadger-tls
        hosts:
          - deltabadger.example.com

persistence:
  storage:
    enabled: true
    storageClass: "fast-ssd"
    size: 20Gi

# Secrets are optional since app v2: SECRET_KEY_BASE is auto-generated on first
# start and persisted to /app/storage/.secrets on the PVC. Provide your own only
# if you want to manage it explicitly (generate with: openssl rand -hex 64).
#
# UPGRADING FROM A 1.x RELEASE? Keep the secret enabled with the exact
# SECRET_KEY_BASE, DEVISE_SECRET_KEY and APP_ENCRYPTION_KEY values your 1.x
# install used, so the MigrateToRailsEncryption migration can decrypt existing
# data. They can be removed after the migration has run.
secrets:
  secrets:
    enabled: false
    # stringData:
    #   SECRET_KEY_BASE: "REPLACE_WITH_YOUR_SECRET_KEY_BASE"
    #   # Legacy keys - only needed while upgrading from 1.x:
    #   DEVISE_SECRET_KEY: "YOUR_EXISTING_DEVISE_SECRET_KEY"
    #   APP_ENCRYPTION_KEY: "YOUR_EXISTING_APP_ENCRYPTION_KEY"
